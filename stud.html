<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POSTECK Billing</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d63d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="POSTECK Billing">
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('pt-billing-theme'); } catch (e) {}
    var theme = saved || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  .option-group { margin-bottom: 14px; }
  .option-group h4 { margin: 0 0 8px; font-size: 13px; font-weight:700; color: var(--text); }
  .option-chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .option-chip { display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; background:var(--card-bg-soft, rgba(255,255,255,0.08)); font-size:13px; }
  .option-chip button { border:none; background:transparent; color:inherit; cursor:pointer; font-size:14px; opacity:0.65; line-height:1; padding:0; }
  .option-chip button:hover { opacity:1; }
  .option-add-row { display:flex; gap:8px; }
  .option-add-row input { flex:1; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="logos">
      <img class="logo-img logo-supplies" src="logo-supplies.jpg" alt="Posteck Supplies Co., Ltd.">
      <img class="logo-img logo-prestressing" src="logo-prestressing.jpg" alt="Posteck Prestressing Co., Ltd.">
    </div>
    <div class="brand-divider"></div>
    <div class="brand-block">
      <span class="brand">POSTECK</span>
      <span class="brand-sub">BILLING</span>
    </div>
    <nav class="topnav">
      <a href="index.html" data-page="index">หน้าแรก</a>
      <a href="projects.html" data-page="projects">โครงการ</a>
      <a href="combo.html" data-page="combo">ค่าวัสดุ+ค่าแรง</a>
      <a href="material.html" data-page="material">ค่าวัสดุ</a>
      <a href="stressing.html" data-page="stressing">ค่าแรง</a>
      <a href="stud.html" data-page="stud">สตัท</a>
      <a href="history.html" data-page="history">ประวัติ</a>
      <button type="button" class="icon-btn" id="themeToggle" aria-label="สลับโหมดมืด/สว่าง">🌙</button>
      <button type="button" class="icon-btn" id="logoutBtn" aria-label="ออกจากระบบ" title="ออกจากระบบ">⏻</button>
    </nav>
  </div>
</div>

<div class="page">
  <div class="eyebrow">ออกเอกสารใหม่</div>
  <h1>ใบส่งมอบ — สตัท</h1>
  <p class="subtitle">รายการขนาด / จำนวน / สี</p>

  <div class="card" style="margin-top:20px">
    <div class="card-head">
      <h3>จัดการตัวเลือกขนาด/สี</h3>
    </div>
    <div class="card-body">
      <div class="option-group">
        <h4>ขนาด</h4>
        <div class="option-chips" id="sizeChips"></div>
        <div class="option-add-row">
          <input type="text" id="newSizeInput" placeholder="เช่น M5x165">
          <button type="button" class="btn btn-secondary" id="addSizeBtn">+ เพิ่ม</button>
        </div>
      </div>
      <div class="option-group" style="margin-bottom:0">
        <h4>สี</h4>
        <div class="option-chips" id="colorChips"></div>
        <div class="option-add-row">
          <input type="text" id="newColorInput" placeholder="เช่น ฟ้า">
          <button type="button" class="btn btn-secondary" id="addColorBtn">+ เพิ่ม</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:20px">
    <div class="card-head">
      <h3>ข้อมูลการส่งมอบ</h3>
      <span class="co-tag">Posteck Supplies</span>
    </div>
    <div class="card-body">
      <form id="form">
        <div class="field">
          <label>โครงการ</label>
          <select id="project" required></select>
        </div>

        <div class="field">
          <label>เลขที่ใบสั่งซื้อ (PO)</label>
          <input type="text" id="poNo" placeholder="เช่น PO-KATU-000308" required>
        </div>

        <div class="field">
          <label>วันที่</label>
          <input type="date" id="date" required>
        </div>

        <div class="row">
          <div class="field">
            <label>อาคาร</label>
            <select id="building" required></select>
          </div>
          <div class="field">
            <label>ชั้น</label>
            <select id="floor" required></select>
          </div>
        </div>

        <div class="field">
          <label>ประเภทสตัท</label>
          <input type="text" id="studType" value="PG" required>
        </div>

        <div class="field">
          <label>รายการ (ขนาด / จำนวน / สี)</label>
          <div id="items"></div>
          <button type="button" class="btn btn-secondary" id="addRow">+ เพิ่มแถว</button>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn" style="margin-top:16px">ออกเอกสาร</button>
      </form>

      <div id="resultBox" style="display:none"></div>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
  requireAuth();
  wireTopbar('stud');
  wireProjectCascade('project', 'building', 'floor');
  wireProjectPOAutofill('project', 'poNo', 'StudPO');
  document.getElementById('date').value = todayISO();

  var itemsContainer = document.getElementById('items');
  var STUD_SIZES = [];
  var STUD_COLORS = [];

  function optionsHtml(values, placeholder) {
    var html = '<option value="">' + placeholder + '</option>';
    values.forEach(function (v) { html += '<option value="' + v + '">' + v + '</option>'; });
    return html;
  }

  function addItemRow(size, qty, color) {
    var row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML =
      '<div class="field" style="flex:2"><select class="size" required>' + optionsHtml(STUD_SIZES, '-- ขนาด --') + '</select></div>' +
      '<div class="field" style="flex:1"><input type="number" class="qty" placeholder="จำนวน" value="' + (qty || '') + '"></div>' +
      '<div class="field" style="flex:1"><select class="color" required>' + optionsHtml(STUD_COLORS, '-- สี --') + '</select></div>' +
      '<button type="button" class="btn btn-secondary remove">ลบ</button>';
    if (size) row.querySelector('.size').value = size;
    if (color) row.querySelector('.color').value = color;
    row.querySelector('.remove').addEventListener('click', function () {
      row.remove();
    });
    itemsContainer.appendChild(row);
  }

  document.getElementById('addRow').addEventListener('click', function () { addItemRow(); });

  // Re-populates every already-rendered row's <select> options from the current STUD_SIZES/
  // STUD_COLORS (after adding/removing an option) without losing what was already picked.
  function refreshItemRowOptions() {
    itemsContainer.querySelectorAll('.item-row').forEach(function (row) {
      var sizeSel = row.querySelector('.size'), colorSel = row.querySelector('.color');
      var curSize = sizeSel.value, curColor = colorSel.value;
      sizeSel.innerHTML = optionsHtml(STUD_SIZES, '-- ขนาด --');
      colorSel.innerHTML = optionsHtml(STUD_COLORS, '-- สี --');
      if (STUD_SIZES.indexOf(curSize) !== -1) sizeSel.value = curSize;
      if (STUD_COLORS.indexOf(curColor) !== -1) colorSel.value = curColor;
    });
  }

  function renderOptionChips(containerId, type, values) {
    var el = document.getElementById(containerId);
    el.innerHTML = '';
    values.forEach(function (v) {
      var chip = document.createElement('span');
      chip.className = 'option-chip';
      var span = document.createElement('span');
      span.textContent = v;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = '✕';
      btn.addEventListener('click', function () {
        if (!confirm('ลบตัวเลือก "' + v + '" ใช่หรือไม่?')) return;
        apiCall('deleteStudOption', { type: type, value: v })
          .then(loadStudOptions)
          .catch(function (err) { alert('เกิดข้อผิดพลาด: ' + err.message); });
      });
      chip.appendChild(span);
      chip.appendChild(btn);
      el.appendChild(chip);
    });
  }

  function loadStudOptions() {
    return apiCall('listStudOptions').then(function (opts) {
      STUD_SIZES = opts.sizes || [];
      STUD_COLORS = opts.colors || [];
      renderOptionChips('sizeChips', 'size', STUD_SIZES);
      renderOptionChips('colorChips', 'color', STUD_COLORS);
      refreshItemRowOptions();
      if (itemsContainer.querySelectorAll('.item-row').length === 0) addItemRow();
    });
  }

  function addOption(type, inputId) {
    var input = document.getElementById(inputId);
    var value = input.value.trim();
    if (!value) return;
    apiCall('addStudOption', { type: type, value: value })
      .then(function () { input.value = ''; return loadStudOptions(); })
      .catch(function (err) { alert('เกิดข้อผิดพลาด: ' + err.message); });
  }
  document.getElementById('addSizeBtn').addEventListener('click', function () { addOption('size', 'newSizeInput'); });
  document.getElementById('addColorBtn').addEventListener('click', function () { addOption('color', 'newColorInput'); });
  document.getElementById('newSizeInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addOption('size', 'newSizeInput'); } });
  document.getElementById('newColorInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addOption('color', 'newColorInput'); } });

  loadStudOptions().catch(function (err) {
    document.getElementById('sizeChips').textContent = 'โหลดตัวเลือกไม่สำเร็จ: ' + err.message;
  });

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();

    var items = [];
    itemsContainer.querySelectorAll('.item-row').forEach(function (row) {
      var size = row.querySelector('.size').value.trim();
      var qty = row.querySelector('.qty').value;
      var color = row.querySelector('.color').value.trim();
      if (size && qty) items.push({ size: size, qty: qty, color: color });
    });

    if (items.length === 0) {
      showError('resultBox', 'กรุณากรอกอย่างน้อย 1 รายการ (ขนาด + จำนวน)');
      return;
    }

    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'กำลังออกเอกสาร...';

    var form = {
      poNo: document.getElementById('poNo').value.trim(),
      date: document.getElementById('date').value,
      project: document.getElementById('project').value,
      building: document.getElementById('building').value,
      floor: document.getElementById('floor').value,
      studType: document.getElementById('studType').value.trim(),
      items: items
    };

    submitWithVerify_('submitStud', form, 'stud', 'PONo', form.poNo)
      .then(function (res) {
        btn.disabled = false;
        btn.textContent = 'ออกเอกสาร';
        showResult('resultBox', res.docNo, res.originalUrl, res.copyUrl, res.verified);
      })
      .catch(function (err) {
        btn.disabled = false;
        btn.textContent = 'ออกเอกสาร';
        showError('resultBox', err.message);
      });
  });
</script>
</body>
</html>
