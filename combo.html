<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POSTECK Billing</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d63d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="POSTECK Billing">
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('pt-billing-theme'); } catch (e) {}
    var theme = saved || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="shared.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="logos">
      <img class="logo-img logo-supplies" src="logo-supplies.jpg" alt="Posteck Supplies Co., Ltd.">
      <img class="logo-img logo-prestressing" src="logo-prestressing.jpg" alt="Posteck Prestressing Co., Ltd.">
    </div>
    <div class="brand-divider"></div>
    <div class="brand-block">
      <span class="brand">POSTECK</span>
      <span class="brand-sub">BILLING</span>
    </div>
    <nav class="topnav">
      <a href="index.html" data-page="index">หน้าแรก</a>
      <a href="projects.html" data-page="projects">โครงการ</a>
      <a href="combo.html" data-page="combo">ค่าวัสดุ+ค่าแรง</a>
      <a href="material.html" data-page="material">ค่าวัสดุ</a>
      <a href="stressing.html" data-page="stressing">ค่าแรง</a>
      <a href="stud.html" data-page="stud">สตัท</a>
      <a href="history.html" data-page="history">ประวัติ</a>
      <button type="button" class="icon-btn" id="themeToggle" aria-label="สลับโหมดมืด/สว่าง">🌙</button>
      <button type="button" class="icon-btn" id="logoutBtn" aria-label="ออกจากระบบ" title="ออกจากระบบ">⏻</button>
    </nav>
  </div>
</div>

<div class="page">
  <div class="eyebrow">ออกเอกสารใหม่</div>
  <h1>ใบส่งมอบ — ค่าวัสดุ + ค่าแรง</h1>
  <p class="subtitle">กรอกโครงการ/อาคาร/ชั้นครั้งเดียว ออกเอกสารทั้งสองแบบพร้อมกัน</p>

  <div class="card" style="margin-top:20px">
    <div class="card-head">
      <h3>ข้อมูลร่วม</h3>
    </div>
    <div class="card-body">
      <form id="form">
        <div class="field">
          <label>โครงการ</label>
          <select id="project" required></select>
        </div>
        <div class="row">
          <div class="field">
            <label>อาคาร</label>
            <select id="building" required></select>
          </div>
          <div class="field">
            <label>ชั้น</label>
            <select id="floor" required></select>
          </div>
        </div>
        <div class="field">
          <label>วันที่</label>
          <input type="date" id="date" required>
        </div>
      </form>
    </div>
  </div>

  <div class="card" style="margin-top:20px">
    <div class="card-head">
      <h3>ค่าวัสดุ</h3>
      <span class="co-tag">Posteck Supplies</span>
    </div>
    <div class="card-body">
      <div class="field">
        <label>เลขที่ใบสั่งซื้อ (PO)</label>
        <input type="text" id="materialPoNo" placeholder="เช่น PO-KATU-000326" required>
      </div>
      <div class="field">
        <label>รายการ</label>
        <div id="materialItems"></div>
        <button type="button" class="btn btn-secondary" id="addMaterialItemBtn">+ เพิ่มรายการ</button>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:20px">
    <div class="card-head">
      <h3>ค่าแรง</h3>
      <span class="co-tag">Posteck Prestressing</span>
    </div>
    <div class="card-body">
      <div class="field">
        <label>เลขที่ใบสั่งงาน (WO)</label>
        <input type="text" id="stressingWoNo" placeholder="เช่น WO-KATU-000208" required>
      </div>
      <div class="field">
        <label>รายการ</label>
        <div id="stressingItems"></div>
        <button type="button" class="btn btn-secondary" id="addStressingItemBtn">+ เพิ่มรายการ</button>
        <div class="hint"><a href="#" id="copyAreaFromMaterial">ใช้พื้นที่เดียวกับค่าวัสดุ รายการที่ 1</a></div>
      </div>
    </div>
  </div>

  <button type="submit" form="form" class="btn btn-primary" id="submitBtn" style="margin-top:20px">ออกเอกสารทั้งสองแบบ</button>

  <div id="resultBox" style="display:none; margin-top:16px"></div>
</div>

<script src="shared.js"></script>
<script>
  requireAuth();
  wireTopbar('combo');
  wireProjectCascade('project', 'building', 'floor');
  wireProjectPOAutofill('project', 'materialPoNo', 'MaterialPO');
  wireProjectPOAutofill('project', 'stressingWoNo', 'StressingPO');
  document.getElementById('date').value = todayISO();

  var getMaterialItems = wireItemRows('materialItems', 'addMaterialItemBtn', [
    { desc: 'ค่าวัสดุ Post-tension slab' },
    { desc: 'ค่าวัสดุ PT-helix (เหล็กกันระเบิดสำเร็จรูป)' }
  ]);
  var getStressingItems = wireItemRows('stressingItems', 'addStressingItemBtn', [
    { desc: 'Stressing service รวมงานติดตั้ง ดึงลวด' }
  ]);

  document.getElementById('copyAreaFromMaterial').addEventListener('click', function (e) {
    e.preventDefault();
    var firstMaterialArea = document.querySelector('#materialItems .item-area');
    var firstStressingArea = document.querySelector('#stressingItems .item-area');
    if (firstMaterialArea && firstStressingArea) firstStressingArea.value = firstMaterialArea.value;
  });

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();

    var materialItems = getMaterialItems();
    var stressingItems = getStressingItems();
    if (materialItems.length === 0 || stressingItems.length === 0) {
      showError('resultBox', 'กรุณากรอกรายการอย่างน้อย 1 รายการ ทั้งค่าวัสดุและค่าแรง');
      return;
    }

    var shared = {
      date: document.getElementById('date').value,
      project: document.getElementById('project').value,
      building: document.getElementById('building').value,
      floor: document.getElementById('floor').value
    };

    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'กำลังออกเอกสาร...';

    var materialForm = Object.assign({}, shared, {
      poNo: document.getElementById('materialPoNo').value.trim(),
      items: materialItems
    });
    var stressingForm = Object.assign({}, shared, {
      woNo: document.getElementById('stressingWoNo').value.trim(),
      items: stressingItems
    });

    apiCall('submitMaterial', { form: materialForm })
      .then(function (materialRes) {
        return apiCall('submitStressing', { form: stressingForm }).then(function (stressingRes) {
          return { materialRes: materialRes, stressingRes: stressingRes };
        });
      })
      .then(function (both) {
        btn.disabled = false;
        btn.textContent = 'ออกเอกสารทั้งสองแบบ';
        var box = document.getElementById('resultBox');
        box.className = 'result-box';
        box.innerHTML =
          'ค่าวัสดุเลขที่ <strong>' + both.materialRes.docNo + '</strong> — ' +
          '<a href="' + both.materialRes.originalUrl + '" target="_blank" rel="noopener">เปิดต้นฉบับ</a> &nbsp;|&nbsp; ' +
          '<a href="' + both.materialRes.copyUrl + '" target="_blank" rel="noopener">เปิดสำเนา</a>' +
          '<br>ค่าแรงเลขที่ <strong>' + both.stressingRes.docNo + '</strong> — ' +
          '<a href="' + both.stressingRes.originalUrl + '" target="_blank" rel="noopener">เปิดต้นฉบับ</a> &nbsp;|&nbsp; ' +
          '<a href="' + both.stressingRes.copyUrl + '" target="_blank" rel="noopener">เปิดสำเนา</a>';
        box.style.display = 'block';
      })
      .catch(function (err) {
        btn.disabled = false;
        btn.textContent = 'ออกเอกสารทั้งสองแบบ';
        showError('resultBox', err.message);
      });
  });
</script>
</body>
</html>
