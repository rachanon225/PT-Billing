<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POSTECK Billing</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d63d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="POSTECK Billing">
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('pt-billing-theme'); } catch (e) {}
    var theme = saved || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="shared.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="logos">
      <img class="logo-img logo-supplies" src="logo-supplies.jpg" alt="Posteck Supplies Co., Ltd.">
      <img class="logo-img logo-prestressing" src="logo-prestressing.jpg" alt="Posteck Prestressing Co., Ltd.">
    </div>
    <div class="brand-divider"></div>
    <div class="brand-block">
      <span class="brand">POSTECK</span>
      <span class="brand-sub">BILLING</span>
    </div>
    <nav class="topnav">
      <a href="index.html" data-page="index">หน้าแรก</a>
      <a href="projects.html" data-page="projects">โครงการ</a>
      <a href="combo.html" data-page="combo">จัดทำเอกสารส่งมอบงาน</a>
      <a href="material.html" data-page="material">ค่าวัสดุ</a>
      <a href="stressing.html" data-page="stressing">ค่าแรง</a>
      <a href="stud.html" data-page="stud">สตัท</a>
      <a href="history.html" data-page="history">ประวัติ</a>
      <button type="button" class="icon-btn" id="themeToggle" aria-label="สลับโหมดมืด/สว่าง">🌙</button>
      <button type="button" class="icon-btn" id="logoutBtn" aria-label="ออกจากระบบ" title="ออกจากระบบ">⏻</button>
    </nav>
  </div>
</div>

<div class="page">
  <div class="eyebrow">ออกเอกสารใหม่</div>
  <h1>จัดทำเอกสารส่งมอบงาน</h1>
  <p class="subtitle">กรอกโครงการ/อาคาร/ชั้นครั้งเดียว ออกค่าวัสดุ + ค่าแรง (และสตัท ถ้าเลือก) พร้อมกัน</p>

  <div class="card" style="margin-top:20px">
    <div class="card-head">
      <h3>ข้อมูลร่วม</h3>
    </div>
    <div class="card-body">
      <form id="form">
        <div class="field">
          <label>โครงการ</label>
          <select id="project" required></select>
        </div>
        <div class="row">
          <div class="field">
            <label>อาคาร</label>
            <select id="building" required></select>
          </div>
          <div class="field">
            <label>ชั้น</label>
            <select id="floor" required></select>
          </div>
        </div>
        <div class="field">
          <label>วันที่</label>
          <input type="date" id="date" required>
        </div>
        <div class="field">
          <label>พื้นที่ (m²)</label>
          <input type="number" step="0.01" id="sharedArea" required>
        </div>
      </form>
    </div>
  </div>

  <div class="card" style="margin-top:20px">
    <div class="card-head">
      <h3>ค่าวัสดุ</h3>
      <span class="co-tag">Posteck Supplies</span>
    </div>
    <div class="card-body">
      <div class="field">
        <label>เลขที่ใบสั่งซื้อ (PO)</label>
        <input type="text" id="materialPoNo" placeholder="เช่น PO-KATU-000326" required>
      </div>
      <div class="field">
        <label>รายการ</label>
        <div id="materialItems"></div>
        <button type="button" class="btn btn-secondary" id="addMaterialItemBtn">+ เพิ่มรายการ</button>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:20px">
    <div class="card-head">
      <h3>ค่าแรง</h3>
      <span class="co-tag">Posteck Prestressing</span>
    </div>
    <div class="card-body">
      <div class="field">
        <label>เลขที่ใบสั่งงาน (WO)</label>
        <input type="text" id="stressingWoNo" placeholder="เช่น WO-KATU-000208" required>
      </div>
      <div class="field">
        <label>รายการ</label>
        <div id="stressingItems"></div>
        <button type="button" class="btn btn-secondary" id="addStressingItemBtn">+ เพิ่มรายการ</button>
      </div>
    </div>
  </div>

  <div style="margin-top:20px">
    <button type="button" class="btn btn-secondary" id="studToggle">+ ใช้สตัท</button>
  </div>

  <div class="card" id="studCard" style="margin-top:20px; display:none">
    <div class="card-head">
      <h3>สตัท</h3>
      <span class="co-tag">Posteck Supplies</span>
    </div>
    <div class="card-body">
      <fieldset id="studFieldset" disabled style="border:0;margin:0;padding:0;min-width:0">
        <div class="field">
          <label>เลขที่ใบสั่งซื้อ (PO)</label>
          <input type="text" id="studPoNo" placeholder="เช่น PO-KATU-000308" required>
        </div>
        <div class="field">
          <label>ประเภทสตัท</label>
          <input type="text" id="studType" value="PG" required>
        </div>
        <div class="field">
          <label>รายการ (ขนาด / จำนวน / สี)</label>
          <div id="studItems"></div>
          <button type="button" class="btn btn-secondary" id="addStudRow">+ เพิ่มแถว</button>
        </div>
      </fieldset>
    </div>
  </div>

  <button type="submit" form="form" class="btn btn-primary" id="submitBtn" style="margin-top:20px">ออกเอกสารทั้งสองแบบ</button>

  <div id="resultBox" style="display:none; margin-top:16px"></div>
</div>

<script src="shared.js"></script>
<script>
  requireAuth();
  wireTopbar('combo');
  wireProjectCascade('project', 'building', 'floor');
  wireProjectPOAutofill('project', 'materialPoNo', 'MaterialPO');
  wireProjectPOAutofill('project', 'stressingWoNo', 'StressingPO');
  wireProjectPOAutofill('project', 'studPoNo', 'StudPO');
  document.getElementById('date').value = todayISO();

  var getMaterialItems = wireItemRows('materialItems', 'addMaterialItemBtn', 'sharedArea', [
    { desc: 'ค่าวัสดุ Post-tension slab' },
    { desc: 'ค่าวัสดุ PT-helix (เหล็กกันระเบิดสำเร็จรูป)' }
  ]);
  var getStressingItems = wireItemRows('stressingItems', 'addStressingItemBtn', 'sharedArea', [
    { desc: 'Stressing service รวมงานติดตั้ง ดึงลวด' }
  ]);

  // Optional stud section: toggled on/off; while off, its fieldset is disabled so its required
  // inputs don't block submission and nothing stud-related is sent.
  var studRows = wireStudItemRows('studItems', 'addStudRow');
  var studOn = false;
  var studOptionsLoaded = false;
  var SUBMIT_LABEL = function () { return studOn ? 'ออกเอกสารทั้งสามแบบ' : 'ออกเอกสารทั้งสองแบบ'; };

  document.getElementById('studToggle').addEventListener('click', function () {
    studOn = !studOn;
    document.getElementById('studCard').style.display = studOn ? '' : 'none';
    document.getElementById('studFieldset').disabled = !studOn;
    this.textContent = studOn ? '✓ ใช้สตัท (คลิกเพื่อยกเลิก)' : '+ ใช้สตัท';
    this.className = studOn ? 'btn btn-primary' : 'btn btn-secondary';
    document.getElementById('submitBtn').textContent = SUBMIT_LABEL();
    if (studOn && !studOptionsLoaded) {
      apiCall('listStudOptions').then(function (opts) {
        studOptionsLoaded = true;
        studRows.setOptions(opts);
      }).catch(function (err) { showError('resultBox', 'โหลดตัวเลือกสตัทไม่สำเร็จ: ' + err.message); });
    }
  });

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();

    var materialItems = getMaterialItems();
    var stressingItems = getStressingItems();
    if (materialItems.length === 0 || stressingItems.length === 0) {
      showError('resultBox', 'กรุณากรอกรายการอย่างน้อย 1 รายการ ทั้งค่าวัสดุและค่าแรง');
      return;
    }
    var studItems = studOn ? studRows.getItems() : [];
    var studPoNo = document.getElementById('studPoNo').value.trim();
    var studType = document.getElementById('studType').value.trim();
    if (studOn && (studItems.length === 0 || !studPoNo || !studType)) {
      showError('resultBox', 'กรุณากรอกสตัทให้ครบ (เลขที่ PO, ประเภทสตัท และรายการ ขนาด + จำนวน อย่างน้อย 1 แถว) หรือกดปุ่ม "ใช้สตัท" อีกครั้งเพื่อยกเลิก');
      return;
    }

    var shared = {
      date: document.getElementById('date').value,
      project: document.getElementById('project').value,
      building: document.getElementById('building').value,
      floor: document.getElementById('floor').value
    };

    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'กำลังออกเอกสาร...';

    var materialForm = Object.assign({}, shared, {
      poNo: document.getElementById('materialPoNo').value.trim(),
      items: materialItems
    });
    var stressingForm = Object.assign({}, shared, {
      woNo: document.getElementById('stressingWoNo').value.trim(),
      items: stressingItems
    });

    // Fire the writes at once instead of waiting for material to finish before starting
    // stressing — they're independent actions against different sheets, so there's no reason
    // to serialize them. Each goes through submitWithVerify_ (see shared.js), which auto-checks
    // whether an ambiguous response actually saved instead of surfacing a scary "error" for what
    // is, in practice, almost always a successful write with a lost response.
    var materialPromise = submitWithVerify_('submitMaterial', materialForm, 'material', 'PONo', materialForm.poNo);
    var stressingPromise = submitWithVerify_('submitStressing', stressingForm, 'stressing', 'WONo', stressingForm.woNo);
    var promises = [materialPromise, stressingPromise];
    if (studOn) {
      var studForm = Object.assign({}, shared, { poNo: studPoNo, studType: studType, items: studItems });
      promises.push(submitWithVerify_('submitStud', studForm, 'stud', 'PONo', studForm.poNo));
    }

    Promise.allSettled(promises).then(function (results) {
      btn.disabled = false;
      btn.textContent = SUBMIT_LABEL();
      var materialResult = results[0];
      var stressingResult = results[1];
      var studResult = results[2]; // undefined when stud wasn't requested
      var box = document.getElementById('resultBox');

      function line(label, result) {
        if (result.status !== 'fulfilled') return label + 'ผิดพลาด: ' + result.reason.message;
        var res = result.value;
        return label + 'เลขที่ <strong>' + res.docNo + '</strong> — ' +
          '<a href="' + res.originalUrl + '" target="_blank" rel="noopener">เปิดต้นฉบับ</a> &nbsp;|&nbsp; ' +
          '<a href="' + res.copyUrl + '" target="_blank" rel="noopener">เปิดสำเนา</a>' +
          (res.verified ? ' <span style="font-size:11px;opacity:.7">(เซิร์ฟเวอร์ตอบกลับช้า — ตรวจสอบซ้ำแล้วว่าบันทึกสำเร็จ)</span>' : '');
      }

      var labeled = [['ค่าวัสดุ', materialResult], ['ค่าแรง', stressingResult]];
      if (studResult) labeled.push(['สตัท', studResult]);
      var okCount = labeled.filter(function (p) { return p[1].status === 'fulfilled'; }).length;

      if (okCount === labeled.length) {
        box.className = 'result-box';
        box.innerHTML = labeled.map(function (p) { return line(p[0], p[1]); }).join('<br>');
      } else {
        box.className = 'error-box';
        var lines = labeled.map(function (p) { return line(p[0], p[1]); });
        if (okCount > 0) {
          lines.push('กรุณาออกเฉพาะเอกสารที่ผิดพลาดแยกที่หน้าฟอร์มของมันโดยตรง (อย่ากดส่งฟอร์มนี้ซ้ำ จะออกใบที่สำเร็จแล้วซ้ำอีกใบ)');
        }
        box.innerHTML = lines.join('<br>');
      }
      box.style.display = 'block';
    });
  });
</script>
</body>
</html>
